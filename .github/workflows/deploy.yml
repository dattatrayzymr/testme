name: Deploy Job
run-name: Deploy ${{ github.event.inputs.branch || github.ref_name }} to ${{ github.event.inputs.environment || 'prod' }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to Deploy"
        required: true
        default: main
        type: string

      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - stage

  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Run only for manual trigger OR main push
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'main')
    environment: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - uses: trstringer/manual-approval@v1
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        timeout-minutes: 1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: dattatrayzymr
          minimum-approvals: 1
          issue-title: "Deploying to Prod"
          issue-body: "Please approve or deny the deployment to Prod."
          
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Use input branch for manual run, branch of push for automatic run
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Validate branch exists
        run: |
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"

          git fetch origin "$BRANCH" || {
            echo "❌ Branch '$BRANCH' does not exist in origin"
            exit 1
          }

          echo "✅ Branch '$BRANCH' exists"
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Generate .env file
        run: |
          # Determine environment
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "main" ]]; then
            ENV="prod"
          else
            ENV="${{ github.event.inputs.environment }}"
          fi

          echo "STAGE=$ENV" >> $GITHUB_ENV

          cat <<EOF > .env
          BRANCH=${{ github.event.inputs.branch || github.ref_name }}
          AWS_CLIENT_ID=${{ secrets.AWS_CLIENT_ID }}
          AWS_CLIENT_SECRET=${{ secrets.AWS_CLIENT_SECRET }}
          FIRST_ENV=${{ vars.FIRST_ENV }}
          URL=${{ vars.URL }}
          STAGE=$ENV
          EOF

      - name: Print all environment variables
        run: cat .env

      - name: Install Dependencies
        run: npm ci        

      # ---------------- RELEASE (PROD ONLY) ----------------
      - name: Skip release if not PROD
        run: |
          if [[ "$STAGE" != "prod" ]]; then
            echo "SKIP_RELEASE=true" >> $GITHUB_ENV
          fi

      - name: Calculate next semantic version
        if: env.SKIP_RELEASE != 'true'
        id: versioning
        run: |
          git fetch --tags
          LAST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)

          if [[ -z "$LAST_TAG" ]]; then
            VERSION="1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create zip artifact
        if: env.SKIP_RELEASE != 'true'
        run: |
          zip -r prod-release-code.zip . \
            -x "node_modules/*" \
            -x ".build/*" \
            -x ".git/*" \
            -x "coverage/*"

      - name: Read release notes
        id: read_release
        if: env.SKIP_RELEASE != 'true'
        run: |
          r=$(cat release-prod.md)
          r="${r//'%'/'%25'}"
          r="${r//$'\n'/'%0A'}"
          r="${r//$'\r'/'%0D'}"
          echo "RELEASE_BODY=$r" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: env.SKIP_RELEASE != 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          tag: v${{ steps.versioning.outputs.version }}
          release_name: v${{ steps.versioning.outputs.version }}
          file: prod-release-code.zip
          asset_name: Prod-release-v${{ steps.versioning.outputs.version }}.zip
          overwrite: false
          body: ${{ steps.read_release.outputs.RELEASE_BODY }}
