name: Deploy Job
run-name: Deploy ${{ github.event.inputs.branch || github.ref_name }} to ${{ github.event.inputs.environment || 'prod' }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to Deploy"
        required: true
        default: main
        type: string

      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - stage

  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Run only for manual trigger OR main push
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'main')
    environment: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Use input branch for manual run, branch of push for automatic run
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Load environment variables dynamically
        shell: bash
        run: |
          # Determine environment
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "main" ]]; then
            ENV="prod"
          else
            ENV="${{ github.event.inputs.environment }}"
          fi

          echo "Deploying to environment: $ENV"

          # Export environment-specific variables
          echo "AWS_CLIENT_ID=${{ secrets.AWS_CLIENT_ID }}" >> $GITHUB_ENV
          echo "AWS_CLIENT_SECRET=${{ secrets.AWS_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "FIRST_ENV=${{ vars.FIRST_ENV }}" >> $GITHUB_ENV
          echo "URL=${{ vars.URL }}" >> $GITHUB_ENV
          echo "STAGE=$ENV" >> $GITHUB_ENV

      - name: Print all environment variables
        run: printenv | sort

