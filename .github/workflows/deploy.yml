name: Deploy Job
run-name: Deploy ${{ github.ref_name }} to ${{ inputs.environment || 'prod' }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to Deploy"
        required: true
        default: main
        type: string

      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - stage

  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Run only for manual trigger OR main push
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'main')
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - name: Validate branch exists
        run: |
          BRANCH="${{ inputs.branch || github.ref_name }}"

          git fetch origin "$BRANCH" || {
            echo "❌ Branch '$BRANCH' does not exist in origin"
            exit 1
          }

          echo "✅ Branch '$BRANCH' exists"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Use input branch for manual run, branch of push for automatic run
          ref: ${{ inputs.branch || github.ref_name }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          
      - name: Generate .env file
        run: |
          # Determine environment
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "main" ]]; then
            ENV="prod"
          else
            ENV="${{ github.event.inputs.environment }}"
          fi

          echo "STAGE=$ENV" >> $GITHUB_ENV

          cat <<EOF > .env
          BRANCH=${{ github.event.inputs.branch || github.ref_name }}
          AWS_CLIENT_ID=${{ secrets.AWS_CLIENT_ID }}
          AWS_CLIENT_SECRET=${{ secrets.AWS_CLIENT_SECRET }}
          FIRST_ENV=${{ vars.FIRST_ENV }}
          URL=${{ vars.URL }}
          STAGE=$ENV
          EOF

      - name: Print all environment variables
        run: printenv | sort

      - name: Print all environment variables
        run: cat .env

